[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catdog-homework"
version = "0.1.0"
description = "Final PyTorch DNN, CNN and RNN models for cat versus dog classification"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "Pillow>=10.0", "matplotlib>=3.7"]

[project.scripts]
catdog-train = "catdog.train:main"
catdog-evaluate = "catdog.evaluate:main"
catdog-predict = "catdog.predict:main"

[tool.setuptools.packages.find]
where = ["src"]
